name: Ingest

on:
  schedule:
    # Off :00 — GitHub delays or drops jobs at the start of the hour.
    - cron: "23 6,12,18 * * *"
      timezone: Australia/Sydney
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run ingest
      - name: Commit listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No listing changes"
          else
            git commit -m "Update Ritz listings"
            git push
          fi
